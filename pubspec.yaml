name: reader
description: "多平台阅读器：Android 与 Linux 桌面共用一套自适应界面"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  path_provider: ^2.1.4
  file_selector: ^1.0.3
  http: ^1.2.2
  xml: ^6.5.0
  crypto: ^3.0.5
  archive: ^4.0.0
  intl: ^0.20.2
  fast_gbk: ^1.0.0
  # 单一音频实现，覆盖 android/ios/linux/macos/windows/web，无需平台分支
  audioplayers: ^6.8.1
  html: ^0.15.7
  serious_python:
    hosted: https://pub.flutter-io.cn
    version: ^5.0.0
  hetu_script: ^0.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - python/examples/txt_cleaner.py
    - python/examples/fake_source.py
    - docs/插件开发指南.md
