name: Build

# 仅手动触发：在 Actions 页面 Run workflow，或 gh workflow run ci.yml 选择目标。
#
# 构建策略：
#   - 默认只构建 debug（Android 仅 arm64，桌面构建 debug 产物）
#   - 发行版（Release）由 build_release 复选框决定，默认不构建；
#     勾选后 Android 出多架构 Release APK，桌面出 Release tar.gz 与 AppImage
#
# 为兼容性与稳定性做的固定（不使用 *-latest / 浮动 tag）：
#   - 构建环境：Debian 12 (bookworm) 容器，系统包版本由发行版冻结；glibc 2.36，
#     产出的 Linux 二进制可在 Debian 12+ / Ubuntu 22.04+ 运行
#   - 运行器：ubuntu-24.04（固定版本标签）
#   - 工具链：Flutter 3.47.0、JDK 17（Debian 包）、Android cmdline-tools 13114758、
#             platform 36、build-tools 36.0.0、NDK 28.2.13676358、Gradle 9.3.1（wrapper）、
#             appimagetool 1.9.1
#     （AGP 9.x 官方兼容表：Gradle ≥ 9.1.0、Build-Tools 36.0.0、NDK 28.2.13676358、JDK 17）
#   - Action：全部固定到具体 release tag
#
# 依赖一律使用官方源（pub.dev、google()/mavenCentral()、services.gradle.org、dl.google.com、
# github.com/AppImage）。
#
# 缓存：Flutter SDK、pub 依赖、Gradle 依赖与构建缓存（含 configuration cache）、
# 整个 Android SDK 目录（含 NDK，首次约 1GB，之后命中缓存）。

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 构建 Android APK（debug，arm64）
        type: boolean
        default: true
      build_linux:
        description: 构建 Linux 桌面（debug）
        type: boolean
        default: true
      build_release:
        description: 同时构建发行版（Release 多架构 APK / 桌面 Release + AppImage）
        type: boolean
        default: false
      publish_release:
        description: 构建完成后创建 GitHub Release 并上传全部产物（tag=v<自动版本>）
        type: boolean
        default: false
      prerelease:
        description: 以预发行版（Pre-release）发布；关闭则标记为正式发行版
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 容器内 Flutter SDK 位于 runner 工具缓存（属主不同），需放开 git 安全目录检查
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: '*'
  FLUTTER_VERSION: '3.47.0'
  JAVA_PACKAGE: openjdk-17-jdk-headless
  ANDROID_SDK_ROOT: /opt/android-sdk
  CMDLINE_TOOLS_VERSION: '13114758'
  ANDROID_PLATFORM: android-36
  BUILD_TOOLS: '36.0.0'
  NDK_VERSION: '28.2.13676358'
  APPIMAGETOOL_VERSION: '1.9.1'
  BASE_PACKAGES: git ca-certificates curl unzip xz-utils tar gzip zstd jq file mawk tzdata python3 python3-pip python3-venv
  # Python 运行时与插件依赖的暂存目录；打包脚本与平台构建共用同一路径
  # （Android 的 Gradle 只认这两个环境变量，缺一即报 "not set"）
  # 运行时压缩包（每个 ABI 30~100MB，来自 objects.githubusercontent.com）的持久缓存目录，
  # 插件据此发条件请求（ETag），避免每次构建都重下导致失败
  # 与时区相关的输出（日志/日期）统一用上海时区
  TZ: Asia/Shanghai

jobs:
  analyze:
    name: 版本号
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      # 只算版本号：不装 Flutter、不做依赖缓存、不跑检查（本地已确认）
      - uses: actions/checkout@v7.0.1
      - id: version
        run: bash tool/ci_version.sh

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    container: debian:12-slim
    needs: analyze
    if: ${{ inputs.build_android }}
    steps:
      - name: 安装基础依赖与 JDK
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ${BASE_PACKAGES} ${JAVA_PACKAGE}
          JDK_DIR="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "JAVA_HOME=$JDK_DIR" >> "$GITHUB_ENV"
          java -version
      - uses: actions/checkout@v7.0.1
      - name: 缓存 Android SDK（含 NDK）
        uses: actions/cache@v6.1.0
        with:
          path: /opt/android-sdk
          key: android-sdk-linux-x64-tools${{ env.CMDLINE_TOOLS_VERSION }}-${{ env.ANDROID_PLATFORM }}-bt${{ env.BUILD_TOOLS }}-ndk${{ env.NDK_VERSION }}
      - name: 安装 Android SDK 组件（固定版本）
        run: |
          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;${ANDROID_PLATFORM}" "build-tools;${BUILD_TOOLS}" "ndk;${NDK_VERSION}"
          echo "--- 已安装组件 ---"
          ls "$ANDROID_SDK_ROOT/platforms" "$ANDROID_SDK_ROOT/build-tools" "$ANDROID_SDK_ROOT/ndk"
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: 缓存 pub 依赖
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-
      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true
      - name: 构建 Debug APK（仅 arm64）
        run: |
          flutter config --no-analytics
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          flutter pub get
          # 插件的运行时压缩包下载偶发失败，失败即重试
          ok=0
          for attempt in 1 2 3; do
            if flutter build apk --debug --target-platform android-arm64 -Pabi=arm64 \
              --dart-define=PLUGIN_PROBE=1 \
              --build-name=${{ needs.analyze.outputs.version }} --build-number=${{ needs.analyze.outputs.code }} \
              --dart-define=APP_VERSION=${{ needs.analyze.outputs.version }} --dart-define=APP_BUILD_NUMBER=${{ needs.analyze.outputs.code }}; then ok=1; break; fi
            echo "第 $attempt 次构建失败，10 秒后重试…"
            sleep 10
          done
          # 循环本身必须以失败收场，否则三次全败也会被当成成功（旧写法的 bug）
          [ "$ok" = "1" ] || { echo "::error::debug APK 三次构建均失败"; exit 1; }
      - name: 构建 Release APK（多架构）
        if: ${{ inputs.build_release }}
        run: |
          OUT=build/app/outputs/flutter-apk
          DEFINES="--dart-define=APP_VERSION=${{ needs.analyze.outputs.version }} --dart-define=APP_BUILD_NUMBER=${{ needs.analyze.outputs.code }}"
          COMMON="--build-name=${{ needs.analyze.outputs.version }} --build-number=${{ needs.analyze.outputs.code }} $DEFINES"

          build() {   # $1=说明 $2=额外的 flutter 参数 $3=产物另存名
            local ok=0
            for attempt in 1 2 3; do
              if flutter build apk --release $COMMON $2; then ok=1; break; fi
              echo "第 $attempt 次构建失败（$1），10 秒后重试…"
              sleep 10
            done
            [ "$ok" = "1" ] || { echo "::error::$1 三次构建均失败"; exit 1; }
            cp -v "$OUT/app-release.apk" "$OUT/$3"
          }

          build "发行版（多架构）" "-Pabi=multi"              "readerplus-release-universal.apk"
          build "发行版（arm64）"  "--target-platform android-arm64 -Pabi=arm64" "readerplus-release-arm64.apk"
          ls -lh $OUT/*.apk
      - name: 生成构建摘要
        run: |
          set +e
          APKS="$(ls build/app/outputs/flutter-apk/*.apk 2>/dev/null)"
          {
            echo "## Android 构建"
            echo
            echo "- 构建环境：Debian 12 (bookworm) 容器 / JDK \`$(java -version 2>&1 | head -1 | sed -E 's/.*\"([^\"]+)\".*/\1/')\`"
            echo "- Flutter ${FLUTTER_VERSION}，cmdline-tools ${CMDLINE_TOOLS_VERSION}，${ANDROID_PLATFORM}，build-tools ${BUILD_TOOLS}，NDK ${NDK_VERSION}"
            echo "- 自动版本：${{ needs.analyze.outputs.version }}（yymmddhhmmss，北京时间）/ versionCode ${{ needs.analyze.outputs.code }}"
            echo "- 本次目标：debug（arm64）$([ "${{ inputs.build_release }}" = "true" ] && echo '＋ Release（多架构）' || echo '；未构建 Release')"
            echo
            echo "| 文件 | 大小 | SHA256（前 16 位）|"
            echo "| --- | --- | --- |"
            for f in $APKS; do
              [ -f "$f" ] || continue
              BADGING="$("$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2" dump badging "$f" 2>/dev/null | grep -E "^package" | head -1)"
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -c1-16)…\` |"
              [ -n "$BADGING" ] && echo "| ↳ | \`${BADGING}\` | |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 上传 APK（编译完成立即上传，先于任何校验）
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: readerplus-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: 校验语音合成原生库已随 APK 打包（产物已上传，失败不影响取包）
        run: |
          set -e
          fail=0
          for APK in build/app/outputs/flutter-apk/*.apk; do
            [ -f "$APK" ] || continue
            LIST="$(unzip -l "$APK" | grep -E 'lib/.*\.so' || true)"
            echo "== $(basename "$APK")（$(du -h "$APK" | cut -f1)）"
            echo "$LIST" | awk '{print "   ", $4, $1}'
            for lib in libsherpa-onnx-c-api libonnxruntime; do
              echo "$LIST" | grep -q "lib/arm64-v8a/$lib.so" \
                || { echo "::error::$(basename "$APK") 缺少 lib/arm64-v8a/$lib.so（JitPack 依赖未生效）"; fail=1; }
            done
            # 只应出现选定的 ABI：debug=arm64，release=arm64(+v7a)，不该有 x86/x86_64
            if echo "$LIST" | grep -qE "lib/(x86|x86_64)/"; then
              echo "::error::$(basename "$APK") 混入了 x86/x86_64 原生库（ABI 过滤未生效）"; fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1
          echo "✓ 原生库齐备，且 ABI 集合符合预期"

  release:
    name: 发布 Release
    runs-on: ubuntu-24.04
    # 等所有构建流水线（Android / Linux / 将来新增的其它平台）全部结束再发布
    needs: [analyze, android, linux]
    # 任一构建失败或取消都不发布；被 input 跳过的 job 结果为 skipped，不影响发布
    if: ${{ inputs.publish_release && !failure() && !cancelled() }}
    permissions:
      contents: write
    steps:
      - name: 取回本次构建的全部产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          for name in readerplus-android-apk readerplus-linux-x64; do
            if gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" \
                 --name "$name" --dir "tmp-$name"; then
              find "tmp-$name" -type f -exec cp -v {} dist/ \;
            else
              echo "跳过（本次未产出）：$name"
            fi
          done
          ls -l dist
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.analyze.outputs.version }}"
          CODE="${{ needs.analyze.outputs.code }}"
          TAG="v$VERSION"
          TARGET="debug（arm64）"
          if [ "${{ inputs.build_release }}" = "true" ]; then
            TARGET="$TARGET ＋ Release（多架构）"
          fi
          {
            printf 'readerplus 自动构建 **%s**（versionCode %s）\n\n' "$VERSION" "$CODE"
            printf '本次构建目标：%s\n\n' "$TARGET"
            printf '提交：%s\n\n' "${{ github.sha }}"
            printf '### 本版要点\n'
            printf -- '- 朗读：引擎改为本地 sherpa-onnx（JitPack 依赖，模型由用户导入）\n'
            printf -- '- 已读章节：进入即记录，目录灰字+删除线，长按切换已读/未读\n'
            printf -- '- 脚本：网络/解密异常降级不再整体崩溃；未捕获异常显示真实原因与堆栈\n'
            printf '\n> 安装包为 CI 产出，签名固定，可直接覆盖安装。\n'
          } > notes.md
          cat notes.md
          [ -n "$(ls -A dist 2>/dev/null)" ] || { echo "::error::没有任何可取回的产物，取消发布"; exit 1; }
          PRE=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then PRE="--prerelease"; fi
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "readerplus $VERSION" \
            --notes-file notes.md \
            $PRE

  linux:
    name: Linux 桌面
    runs-on: ubuntu-24.04
    container: debian:12-slim
    needs: analyze
    if: ${{ inputs.build_linux }}
    steps:
      - name: 安装基础依赖与桌面构建链
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ${BASE_PACKAGES} build-essential clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: 缓存 pub 依赖
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-
      - name: 构建 Debug（桌面）
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build linux --debug --build-name=${{ needs.analyze.outputs.version }} --build-number=${{ needs.analyze.outputs.code }} --dart-define=APP_VERSION=${{ needs.analyze.outputs.version }} --dart-define=APP_BUILD_NUMBER=${{ needs.analyze.outputs.code }}
      - name: 打包 Debug
        run: tar -czf readerplus-linux-x64-debug.tar.gz -C build/linux/x64/debug/bundle .
      - name: 构建 Release（桌面）
        if: ${{ inputs.build_release }}
        run: flutter build linux --release --build-name=${{ needs.analyze.outputs.version }} --build-number=${{ needs.analyze.outputs.code }} --dart-define=APP_VERSION=${{ needs.analyze.outputs.version }} --dart-define=APP_BUILD_NUMBER=${{ needs.analyze.outputs.code }}
      - name: 打包 Release
        if: ${{ inputs.build_release }}
        run: tar -czf readerplus-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - name: 打包 AppImage（仅发行版）
        if: ${{ inputs.build_release }}
        run: bash packaging/linux/build_appimage.sh "${{ needs.analyze.outputs.version }}"
      - name: 生成构建摘要
        run: |
          set +e
          APPIMAGE="$(ls readerplus-*-x86_64.AppImage 2>/dev/null | head -1)"
          GLIBC="$(ldd --version 2>/dev/null | head -1 | awk '{print $NF}')"
          {
            echo "## Linux 桌面构建"
            echo
            echo "- 构建环境：Debian 12 (bookworm) 容器，glibc ${GLIBC}"
            echo "- 运行要求：**glibc ≥ 2.36**（Debian 12+ / Ubuntu 22.04+）"
            echo "- Flutter ${FLUTTER_VERSION}，appimagetool ${APPIMAGETOOL_VERSION}"
            echo "- 自动版本：${{ needs.analyze.outputs.version }}（yymmddhhmmss，北京时间）/ versionCode ${{ needs.analyze.outputs.code }}"
            echo "- 本次目标：debug$([ "${{ inputs.build_release }}" = "true" ] && echo ' ＋ Release ＋ AppImage' || echo '；未构建 Release')"
            echo
            echo "| 文件 | 大小 | SHA256（前 16 位）|"
            echo "| --- | --- | --- |"
            for f in readerplus-linux-x64-debug.tar.gz readerplus-linux-x64.tar.gz $APPIMAGE; do
              [ -f "$f" ] && echo "| $(basename "$f") | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -c1-16)…\` |"
            done
            if [ -n "$APPIMAGE" ]; then
              echo
              echo "运行 AppImage："
              echo
              echo '```bash'
              echo "chmod +x ${APPIMAGE}"
              echo "./${APPIMAGE}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 上传产物
        uses: actions/upload-artifact@v7.0.1
        with:
          name: readerplus-linux-x64
          path: |
            readerplus-linux-x64-debug.tar.gz
            readerplus-linux-x64.tar.gz
            readerplus-*-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30
