name: Build

# 仅手动触发：在 Actions 页面点击 "Run workflow" 选择要构建的目标。
# 依赖一律使用官方源（pub.dev、google()/mavenCentral()、services.gradle.org），
# 项目内不含镜像配置。
#
# 缓存策略（加速二次编译）：
#   1. Flutter SDK           —— subosito/flutter-action 的 cache
#   2. pub 依赖与 .dart_tool  —— actions/cache，按 pubspec.lock 哈希
#   3. Gradle 依赖与构建缓存  —— gradle/actions/setup-gradle
#   4. Android SDK 组件       —— NDK / platform-36 / build-tools-36 定向缓存
#   5. Gradle 发行包          —— setup-gradle 内置 ~/.gradle/wrapper 缓存

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 运行分析与单元测试
        type: boolean
        default: true
      build_android:
        description: 构建 Android APK
        type: boolean
        default: true
      build_linux:
        description: 构建 Linux 桌面
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'
  NDK_VERSION: '28.2.13676358'
  ANDROID_PLATFORM: 'android-36'
  BUILD_TOOLS: '36.0.0'

jobs:
  analyze:
    name: 分析与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: 缓存 pub 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: analyze
    if: ${{ inputs.build_android }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: 缓存 pub 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-
      - name: 定位 Android SDK
        run: |
          # 运行器镜像自带 Android SDK 与 cmdline-tools，不依赖 setup-android action
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties
          echo "SDK=$SDK"
          ls "$SDK"
          ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null || true
      - name: 缓存 Android SDK 组件
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
            /usr/local/lib/android/sdk/platforms/${{ env.ANDROID_PLATFORM }}
            /usr/local/lib/android/sdk/build-tools/${{ env.BUILD_TOOLS }}
          key: android-sdk-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-${{ env.ANDROID_PLATFORM }}-bt${{ env.BUILD_TOOLS }}
      - name: 安装缺失的 SDK 组件
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          CMDLINE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)"
          if [ -n "$CMDLINE" ]; then export PATH="$CMDLINE:$PATH"; fi
          if command -v sdkmanager > /dev/null; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platforms;${ANDROID_PLATFORM}" "build-tools;${BUILD_TOOLS}" "ndk;${NDK_VERSION}"
          else
            echo "::warning::未找到 sdkmanager，交由 AGP 自动安装缺失组件"
          fi
          echo "--- 已安装组件 ---"
          ls "$SDK/ndk" "$SDK/platforms" "$SDK/build-tools" 2>/dev/null || true
      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true
      - name: 构建 Release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: reader-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux 桌面
    runs-on: ubuntu-latest
    needs: analyze
    if: ${{ inputs.build_linux }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: 缓存 pub 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-
      - name: 安装桌面构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: 构建 Release
        run: flutter build linux --release --build-number=${{ github.run_number }}
      - name: 打包
        run: tar -czf reader-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: reader-linux-x64
          path: reader-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30
